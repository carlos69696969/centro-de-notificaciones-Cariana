<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="shopify-api-key" content="fe9abcb93f4b4191be77701f482dec83" />
    <title>CARIANA Visual Variants</title>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-soft: #f9fafb;
        --text: #202124;
        --muted: #667085;
        --border: #d9dee7;
        --primary: #111827;
        --accent: #f04455;
        --ok: #047857;
        --warn: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        min-height: 40px;
        padding: 0 14px;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #475467;
      }

      button.ghost {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        color: var(--text);
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .shell {
        max-width: 1440px;
        margin: 0 auto;
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .connection-panel,
      .panel,
      .product-card,
      .color-card,
      .media-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .connection-panel summary {
        min-height: 46px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--text);
        cursor: pointer;
        font-weight: 800;
        list-style: none;
      }

      .connection-panel summary::-webkit-details-marker {
        display: none;
      }

      .connection-panel summary::after {
        content: "Abrir";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .connection-panel[open] summary::after {
        content: "Cerrar";
      }

      .topbar {
        padding: 0 14px 14px;
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(180px, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.1;
      }

      h2 {
        font-size: 17px;
      }

      h3 {
        font-size: 15px;
      }

      .muted {
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        align-items: start;
      }

      .panel {
        padding: 14px;
        display: grid;
        gap: 12px;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .inline {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .product-list {
        display: grid;
        gap: 8px;
      }

      .product-card {
        padding: 8px;
        display: grid;
        grid-template-columns: 54px 1fr;
        gap: 10px;
        cursor: pointer;
        text-align: left;
        background: #fff;
        color: var(--text);
        min-height: auto;
        font-weight: 400;
      }

      .product-card img,
      .media-card img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #eef1f5;
        border-radius: 6px;
      }

      .product-card strong {
        display: block;
        font-size: 13px;
      }

      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 8px;
      }

      .color-card {
        padding: 8px 10px;
        display: grid;
        gap: 6px;
      }

      .color-head {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
        flex: 1;
      }

      .color-swatch-picker {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        min-height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        flex: 0 0 22px;
        cursor: pointer;
      }

      .swatch {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.18);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
      }

      .color-button {
        min-height: 32px;
        padding: 0 10px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }

      .custom-color-popover {
        position: fixed;
        z-index: 9999;
        width: 238px;
        padding: 10px;
        display: grid;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18);
      }

      .custom-color-field {
        position: relative;
        height: 138px;
        border-radius: 4px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        cursor: crosshair;
        background:
          linear-gradient(to top, #000, transparent),
          linear-gradient(to right, #fff, hsl(var(--picker-hue), 100%, 50%));
      }

      .custom-color-target {
        position: absolute;
        left: calc(var(--picker-sat) * 100%);
        top: calc((1 - var(--picker-val)) * 100%);
        width: 14px;
        height: 14px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.55);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .custom-color-row {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 8px;
        align-items: center;
      }

      .custom-color-preview {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(15, 23, 42, 0.18);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
        background: var(--picker-hex);
      }

      .custom-color-hue {
        width: 100%;
        min-height: 28px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        accent-color: var(--picker-hex);
        background: transparent;
        appearance: none;
        -webkit-appearance: none;
      }

      .custom-color-hue::-webkit-slider-runnable-track {
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          #ff0000 0%,
          #ffff00 16.66%,
          #00ff00 33.33%,
          #00ffff 50%,
          #0000ff 66.66%,
          #ff00ff 83.33%,
          #ff0000 100%
        );
      }

      .custom-color-hue::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        margin-top: -3px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--picker-hex);
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.65), 0 1px 3px rgba(15, 23, 42, 0.2);
        appearance: none;
        -webkit-appearance: none;
      }

      .custom-color-hue::-moz-range-track {
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          #ff0000 0%,
          #ffff00 16.66%,
          #00ff00 33.33%,
          #00ffff 50%,
          #0000ff 66.66%,
          #ff00ff 83.33%,
          #ff0000 100%
        );
      }

      .custom-color-hue::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--picker-hex);
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.65), 0 1px 3px rgba(15, 23, 42, 0.2);
      }

      .custom-color-done {
        width: 100%;
        min-height: 36px;
      }

      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 10px;
      }

      .media-card {
        position: relative;
        overflow: hidden;
        padding: 8px;
        display: block;
        cursor: pointer;
      }

      .media-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(240, 68, 85, 0.16);
      }

      .media-card input {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 18px;
        height: 18px;
        min-height: 18px;
        accent-color: var(--accent);
      }

      .media-order {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pill {
        border: 1px solid var(--border);
        background: var(--surface-soft);
        color: var(--text);
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 13px;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: #b42318;
      }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .topbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <details class="connection-panel">
        <summary>
          <span>Tienda</span>
          <span id="connectionSummary" class="muted"></span>
        </summary>
        <section class="topbar">
          <label>
            Tienda
            <input id="shopDomain" placeholder="cariana-3.myshopify.com" />
          </label>
          <label>
            API interna
            <input id="apiKey" placeholder="APP_INTERNAL_API_KEY" type="password" />
          </label>
          <button id="saveConnection" class="secondary">Guardar conexion</button>
        </section>
      </details>

      <section class="title-row">
        <div>
          <h1>Variantes visual Cariana</h1>
          <div class="muted">Colores, tallas e imagenes agrupadas por producto</div>
        </div>
        <button id="saveConfig" disabled>Guardar en Shopify</button>
      </section>
      <div id="saveStatus" class="status"></div>

      <section class="layout">
        <section class="panel">
          <div class="title-row">
            <div>
              <h2 id="productTitle">Sin producto cargado</h2>
              <div id="productMeta" class="muted"></div>
            </div>
          </div>

          <div class="panel" style="padding: 12px; background: var(--surface-soft)">
            <div class="title-row">
              <h3>Colores detectados</h3>
            </div>
            <div id="colorGrid" class="color-grid"></div>
          </div>

          <div class="panel" style="padding: 12px; background: var(--surface-soft)">
            <div class="title-row">
              <h3 id="mediaTitle">Imagenes</h3>
              <div class="inline">
                <button id="selectAllMedia" class="ghost">Todo</button>
                <button id="clearMedia" class="ghost">Limpiar</button>
              </div>
            </div>
            <div id="mediaGrid" class="media-grid"></div>
          </div>
        </section>

      </section>
    </main>

    <script>
      const state = {
        product: null,
        config: {
          version: 1,
          colorOptionName: "Color",
          sizeOptionName: "Talla",
          groups: {}
        },
        activeColor: "",
        colorPicker: null
      };

      const $ = (id) => document.getElementById(id);

      function on(id, event, handler) {
        const node = $(id);
        if (node) node.addEventListener(event, handler);
      }

      function validHex(value) {
        const hex = String(value || "").trim();
        if (/^#[0-9a-f]{6}$/i.test(hex)) return hex.toLowerCase();
        if (/^#[0-9a-f]{3}$/i.test(hex)) {
          return `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`.toLowerCase();
        }
        return "";
      }

      function hexToRgb(value) {
        const hex = validHex(value) || "#667085";
        return {
          r: parseInt(hex.slice(1, 3), 16),
          g: parseInt(hex.slice(3, 5), 16),
          b: parseInt(hex.slice(5, 7), 16)
        };
      }

      function rgbToHex({ r, g, b }) {
        return `#${[r, g, b]
          .map((part) => Math.max(0, Math.min(255, Math.round(part))).toString(16).padStart(2, "0"))
          .join("")}`;
      }

      function rgbToHsv({ r, g, b }) {
        const red = r / 255;
        const green = g / 255;
        const blue = b / 255;
        const max = Math.max(red, green, blue);
        const min = Math.min(red, green, blue);
        const delta = max - min;
        let hue = 0;

        if (delta) {
          if (max === red) hue = ((green - blue) / delta) % 6;
          else if (max === green) hue = (blue - red) / delta + 2;
          else hue = (red - green) / delta + 4;
          hue *= 60;
          if (hue < 0) hue += 360;
        }

        return {
          h: Math.round(hue),
          s: max ? delta / max : 0,
          v: max
        };
      }

      function hsvToRgb({ h, s, v }) {
        const chroma = v * s;
        const x = chroma * (1 - Math.abs(((h / 60) % 2) - 1));
        const match = v - chroma;
        let rgb = [0, 0, 0];

        if (h < 60) rgb = [chroma, x, 0];
        else if (h < 120) rgb = [x, chroma, 0];
        else if (h < 180) rgb = [0, chroma, x];
        else if (h < 240) rgb = [0, x, chroma];
        else if (h < 300) rgb = [x, 0, chroma];
        else rgb = [chroma, 0, x];

        return {
          r: (rgb[0] + match) * 255,
          g: (rgb[1] + match) * 255,
          b: (rgb[2] + match) * 255
        };
      }

      function updateConnectionSummary() {
        const summary = $("connectionSummary");
        if (!summary) return;
        summary.textContent = $("shopDomain").value.trim() || "Sin tienda";
      }

      function connection() {
        return {
          shopDomain: $("shopDomain").value.trim(),
          apiKey: $("apiKey").value.trim()
        };
      }

      function saveConnection() {
        localStorage.setItem("carianaVariantVisualsShop", $("shopDomain").value.trim());
        localStorage.setItem("carianaVariantVisualsKey", $("apiKey").value.trim());
        updateConnectionSummary();
        setStatus("saveStatus", "Conexion guardada.", "ok");

        const productInput = productInputFromUrlParams(new URLSearchParams(window.location.search));
        if (productInput && $("apiKey").value.trim() && !state.product) {
          loadProduct(productInput);
        }
      }

      function loadConnection() {
        $("shopDomain").value = localStorage.getItem("carianaVariantVisualsShop") || "";
        $("apiKey").value = localStorage.getItem("carianaVariantVisualsKey") || "";
        updateConnectionSummary();
      }

      function productInputFromUrlParams(params) {
        const directKeys = [
          "product",
          "productId",
          "product_id",
          "id",
          "resourceId",
          "resource_id",
          "resource_ids",
          "selected",
          "ids"
        ];

        for (const key of directKeys) {
          const values = params.getAll(key).flatMap((value) => String(value || "").split(","));
          const productValue = values.find((value) => /gid:\/\/shopify\/Product\/\d+|\b\d{8,}\b/.test(value));
          if (productValue) return productValue.trim();
        }

        for (const value of params.values()) {
          const match = String(value || "").match(/gid:\/\/shopify\/Product\/\d+|\b\d{8,}\b/);
          if (match) return match[0];
        }

        return "";
      }

      async function hydrateFromAdminLink() {
        const params = new URLSearchParams(window.location.search);
        const shop = params.get("shop") || params.get("shopDomain") || "";
        const productInput = productInputFromUrlParams(params);

        if (shop) {
          $("shopDomain").value = shop;
          localStorage.setItem("carianaVariantVisualsShop", shop);
          updateConnectionSummary();
        }

        if (!productInput) return;

        if (!$("apiKey").value.trim()) {
          setStatus("saveStatus", "Producto detectado desde Shopify. Abre Tienda, pega la API interna y guarda la conexion.", "ok");
          return;
        }

        await loadProduct(productInput);
      }

      async function api(path, options = {}) {
        const { shopDomain, apiKey } = connection();
        if (!shopDomain || !apiKey) {
          throw new Error("Falta tienda o API interna.");
        }

        const joiner = path.includes("?") ? "&" : "?";
        const response = await fetch(`${path}${joiner}shop=${encodeURIComponent(shopDomain)}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            ...(options.headers || {})
          }
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || payload.detail || `Error ${response.status}`);
        }

        return payload;
      }

      function setStatus(id, message, tone = "") {
        const node = $(id) || $("saveStatus");
        if (!node) return;
        node.textContent = message || "";
        node.className = `status ${tone}`.trim();
      }

      function optionValues(optionName) {
        const option = state.product?.options?.find(
          (item) => item.name.toLowerCase() === String(optionName || "").toLowerCase()
        );
        if (option?.values?.length) return option.values;

        const values = new Set();
        for (const variant of state.product?.variants || []) {
          const selected = variant.selectedOptions.find(
            (item) => item.name.toLowerCase() === String(optionName || "").toLowerCase()
          );
          if (selected?.value) values.add(selected.value);
        }

        return Array.from(values);
      }

      function renderProductSearch(products) {
        if (!$("productList")) return;
        $("productList").innerHTML = "";

        for (const product of products) {
          const button = document.createElement("button");
          button.className = "product-card";
          button.type = "button";
          button.innerHTML = `
            <img src="${product.imageUrl || ""}" alt="">
            <span>
              <strong>${escapeHtml(product.title)}</strong>
              <small class="muted">${escapeHtml(product.handle)} · ${product.totalVariants} variantes</small>
            </span>
          `;
          button.addEventListener("click", () => loadProduct(product.id));
          $("productList").append(button);
        }
      }

      async function searchProducts() {
        try {
          setStatus("saveStatus", "Buscando...");
          const query = $("productSearch")?.value.trim() || "";
          const payload = await api(`/api/variant-visuals/products/search?query=${encodeURIComponent(query)}`);
          renderProductSearch(payload.products || []);
          setStatus("saveStatus", `${payload.products?.length || 0} productos encontrados.`, "ok");
        } catch (error) {
          setStatus("saveStatus", error.message, "error");
        }
      }

      async function loadProduct(input = productInputFromUrlParams(new URLSearchParams(window.location.search))) {
        try {
          if (!input) throw new Error("Abre esta pantalla desde Mas acciones en un producto de Shopify.");
          setStatus("saveStatus", "Cargando producto...");
          const payload = await api(`/api/variant-visuals/product?product=${encodeURIComponent(input)}`);
          state.product = payload.product;
          state.config = payload.savedConfig || buildDefaultConfig(payload.product);
          seedVariantImagesByColor(state.config, payload.product, true);
          state.activeColor = Object.keys(state.config.groups || {})[0] || "";
          renderProduct();
          setStatus("saveStatus", "Producto cargado.", "ok");
        } catch (error) {
          setStatus("saveStatus", error.message, "error");
        }
      }

      function buildDefaultConfig(product) {
        const colorOption = guessOption(product, ["color", "colour", "tono"]);
        const sizeOption = guessOption(product, ["talla", "size", "tamano", "tamaño"]);
        const config = {
          version: 1,
          colorOptionName: colorOption || product.options?.[0]?.name || "Color",
          sizeOptionName: sizeOption || product.options?.[1]?.name || "Talla",
          groups: {}
        };

        for (const value of optionValuesFromProduct(product, config.colorOptionName)) {
          config.groups[value] = {
            label: value,
            hex: guessColorHex(value),
            mediaIds: [],
            variantIds: []
          };
        }

        for (const variant of product.variants || []) {
          const color = variant.selectedOptions.find(
            (option) => option.name.toLowerCase() === config.colorOptionName.toLowerCase()
          )?.value;
          if (color && config.groups[color]) {
            config.groups[color].variantIds.push(variant.id);
          }
        }

        seedVariantImagesByColor(config, product, false);
        return config;
      }

      function imageKey(url) {
        try {
          const parsed = new URL(url);
          return parsed.pathname.split("/").pop().toLowerCase();
        } catch (_error) {
          return String(url || "").split("?")[0].split("/").pop().toLowerCase();
        }
      }

      function findProductMediaForVariantImage(product, variantImage) {
        if (!variantImage?.url) return null;

        const variantKey = imageKey(variantImage.url);
        return (product.media || []).find((media) => {
          return media.id === variantImage.id || imageKey(media.url) === variantKey;
        });
      }

      function variantColorValue(variant, colorOptionName) {
        return variant.selectedOptions.find(
          (option) => option.name.toLowerCase() === String(colorOptionName || "").toLowerCase()
        )?.value;
      }

      function seedVariantImagesByColor(config, product, onlyEmpty) {
        if (!config?.groups || !product) return 0;

        let added = 0;
        for (const [color, group] of Object.entries(config.groups)) {
          if (onlyEmpty && group.mediaIds?.length) continue;

          const mediaIds = new Set(group.mediaIds || []);
          for (const variant of product.variants || []) {
            if (variantColorValue(variant, config.colorOptionName) !== color) continue;

            const media = findProductMediaForVariantImage(product, variant.image);
            if (media?.id && !mediaIds.has(media.id)) {
              mediaIds.add(media.id);
              added += 1;
            }
          }

          group.mediaIds = Array.from(mediaIds);
        }

        return added;
      }

      function optionValuesFromProduct(product, optionName) {
        const option = product.options?.find((item) => item.name.toLowerCase() === optionName.toLowerCase());
        if (option?.values?.length) return option.values;
        return [];
      }

      function guessOption(product, names) {
        const normalized = names.map(normalizeText);
        return product.options?.find((option) => normalized.includes(normalizeText(option.name)))?.name || "";
      }

      function normalizeText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

      function guessColorHex(value) {
        const key = normalizeText(value);
        const colors = {
          blanco: "#ffffff",
          white: "#ffffff",
          negro: "#111111",
          black: "#111111",
          rojo: "#d92d20",
          red: "#d92d20",
          vino: "#7a271a",
          azul: "#175cd3",
          blue: "#175cd3",
          marino: "#101828",
          verde: "#027a48",
          green: "#027a48",
          amarillo: "#fdb022",
          yellow: "#fdb022",
          rosa: "#e31b54",
          pink: "#e31b54",
          beige: "#d6bb98",
          cafe: "#7a5c3e",
          marron: "#7a5c3e",
          gris: "#667085",
          gray: "#667085",
          morado: "#7a5af8",
          naranja: "#ec4a0a"
        };
        return colors[key] || "#667085";
      }

      function renderProduct() {
        const product = state.product;
        $("saveConfig").disabled = !product;
        $("productTitle").textContent = product.title;
        $("productMeta").textContent = `${product.handle} · ${product.variants.length} variantes · ${product.media.length} imagenes`;

        renderOptionSelects();
        ensureGroupsFromOptions();
        renderColors();
        renderMedia();
        renderSummary();
      }

      function renderOptionSelects() {
        if (!$("colorOption") || !$("sizeOption")) return;
        const options = state.product.options || [];
        $("colorOption").innerHTML = options.map(optionTemplate).join("");
        $("sizeOption").innerHTML = options.map(optionTemplate).join("");
        $("colorOption").value = state.config.colorOptionName || options[0]?.name || "";
        $("sizeOption").value = state.config.sizeOptionName || options[1]?.name || "";
      }

      function optionTemplate(option) {
        return `<option value="${escapeHtml(option.name)}">${escapeHtml(option.name)}</option>`;
      }

      function ensureGroupsFromOptions() {
        const colorValues = optionValues(state.config.colorOptionName);
        state.config.groups = state.config.groups || {};

        for (const color of colorValues) {
          if (!state.config.groups[color]) {
            state.config.groups[color] = {
              label: color,
              hex: guessColorHex(color),
              mediaIds: [],
              variantIds: []
            };
          }

          state.config.groups[color].variantIds = (state.product.variants || [])
            .filter((variant) =>
              variant.selectedOptions.some(
                (option) =>
                  option.name.toLowerCase() === state.config.colorOptionName.toLowerCase() &&
                  option.value === color
              )
            )
            .map((variant) => variant.id);

          seedVariantImagesByColor(state.config, state.product, true);
        }

        if (!state.activeColor || !state.config.groups[state.activeColor]) {
          state.activeColor = colorValues[0] || Object.keys(state.config.groups)[0] || "";
        }
      }

      function closeColorPicker() {
        if (!state.colorPicker) return;
        state.colorPicker.popover?.remove();
        state.colorPicker = null;
      }

      function positionColorPicker(popover, anchor) {
        const anchorBox = anchor.getBoundingClientRect();
        const popoverBox = popover.getBoundingClientRect();
        const margin = 8;
        const left = Math.min(
          Math.max(margin, anchorBox.left),
          window.innerWidth - popoverBox.width - margin
        );
        let top = anchorBox.bottom + margin;

        if (top + popoverBox.height > window.innerHeight - margin) {
          top = Math.max(margin, anchorBox.top - popoverBox.height - margin);
        }

        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
      }

      function updateCustomColorPicker() {
        const picker = state.colorPicker;
        if (!picker) return;

        picker.hex = rgbToHex(hsvToRgb({ h: picker.hue, s: picker.saturation, v: picker.value }));
        picker.popover.style.setProperty("--picker-hue", String(picker.hue));
        picker.popover.style.setProperty("--picker-sat", String(picker.saturation));
        picker.popover.style.setProperty("--picker-val", String(picker.value));
        picker.popover.style.setProperty("--picker-hex", picker.hex);
      }

      function moveCustomColorTarget(event) {
        const picker = state.colorPicker;
        if (!picker) return;

        const box = picker.field.getBoundingClientRect();
        picker.saturation = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
        picker.value = Math.max(0, Math.min(1, 1 - (event.clientY - box.top) / box.height));
        updateCustomColorPicker();
      }

      function openColorPicker(color, anchor) {
        const group = state.config.groups?.[color];
        if (!group) return;

        closeColorPicker();

        const hsv = rgbToHsv(hexToRgb(group.hex || guessColorHex(group.label || color)));
        const popover = document.createElement("div");
        popover.className = "custom-color-popover";
        popover.innerHTML = `
          <div class="custom-color-field" data-custom-color-field>
            <span class="custom-color-target"></span>
          </div>
          <div class="custom-color-row">
            <span class="custom-color-preview" aria-hidden="true"></span>
            <input class="custom-color-hue" type="range" min="0" max="359" step="1" data-custom-color-hue aria-label="Tono del color" />
          </div>
          <button type="button" class="custom-color-done" data-custom-color-done>Listo</button>
        `;
        document.body.append(popover);

        state.colorPicker = {
          color,
          popover,
          field: popover.querySelector("[data-custom-color-field]"),
          hue: hsv.h,
          saturation: hsv.s,
          value: hsv.v,
          hex: group.hex || guessColorHex(group.label || color)
        };

        const hueInput = popover.querySelector("[data-custom-color-hue]");
        hueInput.value = String(state.colorPicker.hue);

        state.colorPicker.field.addEventListener("pointerdown", (event) => {
          state.colorPicker.field.setPointerCapture(event.pointerId);
          moveCustomColorTarget(event);
        });
        state.colorPicker.field.addEventListener("pointermove", (event) => {
          if (event.buttons) moveCustomColorTarget(event);
        });
        hueInput.addEventListener("input", (event) => {
          state.colorPicker.hue = Number(event.currentTarget.value);
          updateCustomColorPicker();
        });
        popover.querySelector("[data-custom-color-done]").addEventListener("click", () => {
          group.hex = state.colorPicker.hex;
          closeColorPicker();
          renderColors();
          renderSummary();
        });

        updateCustomColorPicker();
        positionColorPicker(popover, anchor);
      }

      function renderColors() {
        const grid = $("colorGrid");
        grid.innerHTML = "";

        for (const [color, group] of Object.entries(state.config.groups || {})) {
          const card = document.createElement("div");
          card.className = "color-card";
          card.innerHTML = `
            <div class="color-head">
              <button type="button" class="color-swatch-picker" data-color-picker-button="${escapeHtml(color)}" aria-label="Editar color ${escapeHtml(group.label || color)}">
                <span class="swatch" style="background:${escapeHtml(group.hex || "#667085")}"></span>
              </button>
              <button type="button" class="color-button ${state.activeColor === color ? "secondary" : "ghost"}" data-color="${escapeHtml(color)}">
                ${escapeHtml(group.label || color)}
              </button>
            </div>
            <div class="pill-row">
              <span class="pill">${group.mediaIds?.length || 0} imagenes</span>
            </div>
          `;

          grid.append(card);
        }

        grid.querySelectorAll("[data-color]").forEach((node) => {
          node.addEventListener("click", (event) => {
            const color = event.currentTarget.dataset.color;
            state.activeColor = color;
            renderColors();
            renderMedia();
            renderSummary();
          });
        });

        grid.querySelectorAll("[data-color-picker-button]").forEach((node) => {
          node.addEventListener("click", (event) => {
            event.stopPropagation();
            openColorPicker(event.currentTarget.dataset.colorPickerButton, event.currentTarget);
          });
        });
      }

      function renderMedia() {
        $("mediaTitle").textContent = state.activeColor ? `Imagenes para ${state.activeColor}` : "Imagenes";
        const mediaGrid = $("mediaGrid");
        mediaGrid.innerHTML = "";

        const group = state.config.groups?.[state.activeColor];
        const selectedIds = group?.mediaIds || [];
        const selected = new Set(selectedIds);

        for (const media of state.product.media || []) {
          const order = selectedIds.indexOf(media.id);
          const card = document.createElement("div");
          card.className = `media-card ${selected.has(media.id) ? "selected" : ""}`;
          card.dataset.mediaId = media.id;
          card.innerHTML = `
            <input type="checkbox" ${selected.has(media.id) ? "checked" : ""} data-media-id="${escapeHtml(media.id)}" />
            <img src="${media.url}" alt="">
            ${order >= 0 ? `<span class="media-order">${order + 1}</span>` : ""}
          `;
          mediaGrid.append(card);
        }

        mediaGrid.querySelectorAll("[data-media-id]").forEach((input) => {
          input.addEventListener("change", (event) => {
            toggleMedia(event.currentTarget.dataset.mediaId, event.currentTarget.checked);
          });
        });

        mediaGrid.querySelectorAll(".media-card").forEach((card) => {
          card.addEventListener("click", (event) => {
            if (event.target.closest("button") || event.target.matches("input")) return;
            const mediaId = event.currentTarget.dataset.mediaId;
            const isSelected = state.config.groups?.[state.activeColor]?.mediaIds?.includes(mediaId);
            toggleMedia(mediaId, !isSelected);
          });
        });

      }

      function toggleMedia(mediaId, checked) {
        const group = state.config.groups?.[state.activeColor];
        if (!group) return;

        const current = group.mediaIds || [];
        group.mediaIds = checked
          ? current.includes(mediaId)
            ? current
            : [...current, mediaId]
          : current.filter((id) => id !== mediaId);
        renderMedia();
        renderColors();
        renderSummary();
      }

      function renderSummary() {
        return;
      }

      function rebuildColors() {
        if ($("colorOption")) state.config.colorOptionName = $("colorOption").value;
        if ($("sizeOption")) state.config.sizeOptionName = $("sizeOption").value;
        ensureGroupsFromOptions();
        renderColors();
        renderMedia();
        renderSummary();
      }

      function autoAssignMediaFromVariants() {
        const added = seedVariantImagesByColor(state.config, state.product, false);
        renderColors();
        renderMedia();
        renderSummary();
        setStatus(
          "saveStatus",
          added
            ? `${added} imagenes agregadas desde las variantes. Guarda para mandarlo a Shopify.`
            : "No encontre imagenes nuevas asignadas a variantes.",
          added ? "ok" : "error"
        );
      }

      function setAllMedia(checked) {
        const group = state.config.groups?.[state.activeColor];
        if (!group) return;
        group.mediaIds = checked ? (state.product.media || []).map((media) => media.id) : [];
        renderMedia();
        renderColors();
        renderSummary();
      }

      async function saveConfig() {
        try {
          if (!state.product) return;
          $("saveConfig").disabled = true;
          setStatus("saveStatus", "Guardando en Shopify...");
          if ($("colorOption")) state.config.colorOptionName = $("colorOption").value;
          if ($("sizeOption")) state.config.sizeOptionName = $("sizeOption").value;

          await api("/api/variant-visuals/product", {
            method: "POST",
            body: JSON.stringify({
              productId: state.product.id,
              config: state.config
            })
          });

          setStatus("saveStatus", "Configuracion guardada. Regresando al producto...", "ok");
          setTimeout(redirectToShopifyProduct, 450);
        } catch (error) {
          $("saveConfig").disabled = false;
          setStatus("saveStatus", error.message, "error");
        }
      }

      function numericProductId(value) {
        const match = String(value || "").match(/\d{8,}/);
        return match ? match[0] : "";
      }

      function shopifyAdminStoreHandle() {
        const match = window.location.pathname.match(/\/store\/([^/]+)/);
        if (match) return decodeURIComponent(match[1]);

        const shopDomain = connection().shopDomain;
        return shopDomain ? shopDomain.replace(/\.myshopify\.com$/i, "") : "";
      }

      function shopifyProductAdminUrl() {
        const productId = numericProductId(state.product?.id || productInputFromUrlParams(new URLSearchParams(window.location.search)));
        const storeHandle = shopifyAdminStoreHandle();

        if (!productId || !storeHandle) return "";

        return `https://admin.shopify.com/store/${encodeURIComponent(storeHandle)}/products/${productId}`;
      }

      function shopifyProductAdminProtocolUrl() {
        const productId = numericProductId(state.product?.id || productInputFromUrlParams(new URLSearchParams(window.location.search)));

        return productId ? `shopify:admin/products/${productId}` : "";
      }

      function redirectToShopifyProduct() {
        const appBridgeUrl = shopifyProductAdminProtocolUrl();
        const adminUrl = shopifyProductAdminUrl();
        const url = appBridgeUrl || adminUrl;

        if (!url) {
          $("saveConfig").disabled = false;
          setStatus("saveStatus", "Configuracion guardada. No pude encontrar el enlace del producto.", "ok");
          return;
        }

        try {
          if (window.shopify && typeof window.shopify.open === "function" && appBridgeUrl) {
            window.shopify.open(appBridgeUrl, "_top");
            return;
          }

          const link = document.createElement("a");
          link.href = url;
          link.target = "_top";
          link.rel = "noopener";
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (_error) {
          $("saveConfig").disabled = false;
          setStatus("saveStatus", "Configuracion guardada. No pude abrir el producto automaticamente.", "ok");
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      on("saveConnection", "click", saveConnection);
      on("searchProducts", "click", searchProducts);
      on("loadProduct", "click", () => loadProduct());
      on("autoAssignMedia", "click", autoAssignMediaFromVariants);
      on("buildColors", "click", rebuildColors);
      on("colorOption", "change", rebuildColors);
      on("sizeOption", "change", rebuildColors);
      on("selectAllMedia", "click", () => setAllMedia(true));
      on("clearMedia", "click", () => setAllMedia(false));
      on("saveConfig", "click", saveConfig);
      on("productSearch", "keydown", (event) => {
        if (event.key === "Enter") searchProducts();
      });
      document.addEventListener("click", (event) => {
        if (!state.colorPicker) return;
        if (event.target.closest(".custom-color-popover")) return;
        if (event.target.closest("[data-color-picker-button]")) return;
        closeColorPicker();
      });
      window.addEventListener("resize", closeColorPicker);
      window.addEventListener("scroll", closeColorPicker, true);

      loadConnection();
      hydrateFromAdminLink().catch((error) => {
        setStatus("searchStatus", error.message, "error");
      });
    </script>
  </body>
</html>
