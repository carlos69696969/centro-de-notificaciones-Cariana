<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de finanzas CARIANA</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --text: #111827;
        --muted: #667085;
        --border: #d9dee7;
        --green: #087443;
        --green-soft: #e9f8ef;
        --red: #b42318;
        --red-soft: #fff0ed;
        --blue: #0b5cab;
        --blue-soft: #eaf3ff;
        --amber: #b54708;
        --amber-soft: #fff4e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: #fff;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        display: grid;
        place-items: center;
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 6px;
      }

      .nav button {
        height: 42px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #344054;
        text-align: left;
        padding: 0 12px;
        cursor: pointer;
      }

      .nav button.active {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 700;
      }

      .main {
        padding: 24px;
        display: grid;
        gap: 18px;
        align-content: start;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      .muted {
        color: var(--muted);
      }

      .filters {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        font-size: 13px;
        font-weight: 700;
        color: #344054;
      }

      input,
      select {
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        padding: 0 12px;
        color: var(--text);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        min-height: 110px;
        display: grid;
        align-content: space-between;
      }

      .metric strong {
        font-size: 26px;
      }

      .metric.sales {
        border-left: 4px solid var(--green);
      }

      .metric.expenses {
        border-left: 4px solid var(--red);
      }

      .metric.profit {
        border-left: 4px solid var(--blue);
      }

      .metric.orders {
        border-left: 4px solid var(--amber);
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) 380px;
        gap: 14px;
        align-items: start;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .form-grid .wide {
        grid-column: 1 / -1;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }

      .btn {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: #344054;
        padding: 0 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }

      .btn.danger {
        border-color: #fecdca;
        background: var(--red-soft);
        color: var(--red);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 12px 8px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: #475467;
        font-size: 13px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        border-radius: 999px;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 800;
      }

      .pill.sale {
        background: var(--green-soft);
        color: var(--green);
      }

      .pill.expense {
        background: var(--red-soft);
        color: var(--red);
      }

      .empty {
        min-height: 180px;
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
        background: var(--surface-2);
        border-radius: 8px;
        padding: 20px;
      }

      @media (max-width: 960px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metrics,
        .content-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .main {
          padding: 16px;
        }

        .topbar,
        .filters,
        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .form-grid,
        .nav {
          grid-template-columns: 1fr;
        }

        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 10px;
          padding: 8px;
        }

        td {
          border: 0;
          padding: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CAR</div>
          <div>
            <div>CARIANA</div>
            <small class="muted">Finanzas</small>
          </div>
        </div>
        <nav class="nav" aria-label="Secciones">
          <button class="active" type="button">Resumen</button>
          <button type="button">Ventas</button>
          <button type="button">Gastos</button>
          <button type="button">Reportes</button>
        </nav>
      </aside>

      <main class="main">
        <section class="topbar">
          <div>
            <h1>Control financiero</h1>
            <p class="muted">Ventas, gastos y utilidad del negocio en una sola vista.</p>
          </div>
          <div class="filters">
            <div class="field">
              <label for="monthFromFilter">Desde</label>
              <input id="monthFromFilter" type="month" />
            </div>
            <div class="field">
              <label for="monthToFilter">Hasta</label>
              <input id="monthToFilter" type="month" />
            </div>
            <button class="btn primary" id="downloadPdfButton" type="button">Descargar PDF</button>
            <button class="btn" id="seedButton" type="button">Agregar ejemplo</button>
          </div>
        </section>

        <section class="metrics" aria-label="Metricas financieras">
          <article class="metric sales">
            <span class="muted">Ventas</span>
            <strong id="salesTotal">$0.00</strong>
          </article>
          <article class="metric expenses">
            <span class="muted">Costos operativos</span>
            <strong id="expensesTotal">$0.00</strong>
          </article>
          <article class="metric profit">
            <span class="muted">Ganacia</span>
            <strong id="profitTotal">$0.00</strong>
          </article>
          <article class="metric orders">
            <span class="muted">Ticket promedio</span>
            <strong id="averageTicket">$0.00</strong>
            <span class="muted">Solo ventas</span>
          </article>
        </section>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-head">
              <h2>Movimientos</h2>
              <button class="btn danger" id="clearButton" type="button">Limpiar lista</button>
            </div>
            <div id="emptyState" class="empty">Todavia no hay movimientos para este periodo.</div>
            <table id="transactionsTable" hidden>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Tipo</th>
                  <th>Concepto</th>
                  <th>Metodo</th>
                  <th>Monto</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="transactionsBody"></tbody>
            </table>
          </div>

          <aside class="panel">
            <div class="panel-head">
              <h2>Registrar movimiento</h2>
            </div>
            <form id="transactionForm">
              <div class="form-grid">
                <div class="field">
                  <label for="type">Tipo</label>
                  <select id="type" required>
                    <option value="sale">Venta</option>
                    <option value="expense">Gasto</option>
                  </select>
                </div>
                <div class="field">
                  <label for="date">Fecha</label>
                  <input id="date" type="date" required />
                </div>
                <div class="field wide">
                  <label for="concept">Concepto</label>
                  <input id="concept" type="text" placeholder="Ej. Venta Shopify, renta, envio" required />
                </div>
                <div class="field">
                  <label for="method">Metodo</label>
                  <select id="method" required>
                    <option value="Shopify">Shopify</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Otro">Otro</option>
                  </select>
                </div>
                <div class="field">
                  <label for="amount">Monto</label>
                  <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required />
                </div>
              </div>
              <div class="actions">
                <button class="btn primary" type="submit">Guardar movimiento</button>
              </div>
            </form>
          </aside>
        </section>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "cariana_finance_transactions_v1";
      const formatter = new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN"
      });

      const monthFromFilter = document.getElementById("monthFromFilter");
      const monthToFilter = document.getElementById("monthToFilter");
      const downloadPdfButton = document.getElementById("downloadPdfButton");
      const form = document.getElementById("transactionForm");
      const table = document.getElementById("transactionsTable");
      const emptyState = document.getElementById("emptyState");
      const body = document.getElementById("transactionsBody");

      const today = new Date();
      const todayIso = today.toISOString().slice(0, 10);
      const currentMonth = todayIso.slice(0, 7);
      document.getElementById("date").value = todayIso;
      monthFromFilter.value = currentMonth;
      monthToFilter.value = currentMonth;

      function readTransactions() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (_error) {
          return [];
        }
      }

      function writeTransactions(transactions) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      }

      function selectedMonthRange() {
        const from = monthFromFilter.value || currentMonth;
        const to = monthToFilter.value || from;
        return from <= to ? { from, to } : { from: to, to: from };
      }

      function visibleTransactions() {
        const range = selectedMonthRange();
        return readTransactions()
          .filter((item) => {
            const itemMonth = String(item.date || "").slice(0, 7);
            return itemMonth >= range.from && itemMonth <= range.to;
          })
          .sort((a, b) => b.date.localeCompare(a.date));
      }

      function summarizeTransactions(rows) {
        const sales = rows.filter((item) => item.type === "sale");
        const expenses = rows.filter((item) => item.type === "expense");
        const salesTotal = sales.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const expensesTotal = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const average = sales.length ? salesTotal / sales.length : 0;
        return {
          salesTotal,
          expensesTotal,
          profitTotal: salesTotal - expensesTotal,
          average,
          salesCount: sales.length,
          expensesCount: expenses.length,
          count: rows.length
        };
      }

      function monthLabel(monthValue) {
        const [year, month] = String(monthValue || currentMonth).split("-").map(Number);
        const date = new Date(year || today.getFullYear(), (month || 1) - 1, 1);
        return new Intl.DateTimeFormat("es-MX", {
          month: "long",
          year: "numeric"
        }).format(date);
      }

      function selectedRangeLabel() {
        const range = selectedMonthRange();
        return range.from === range.to ? monthLabel(range.from) : `${monthLabel(range.from)} a ${monthLabel(range.to)}`;
      }

      function asciiText(value) {
        return String(value ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^\x20-\x7E]/g, "")
          .trim();
      }

      function pdfText(value) {
        return asciiText(value)
          .replace(/\\/g, "\\\\")
          .replace(/\(/g, "\\(")
          .replace(/\)/g, "\\)");
      }

      function fixedText(value, width) {
        const clean = asciiText(value).replace(/\s+/g, " ");
        return clean.length > width ? `${clean.slice(0, Math.max(0, width - 3))}...` : clean.padEnd(width, " ");
      }

      function moneyPlain(value) {
        return formatter.format(Number(value || 0)).replace(/\s/g, " ");
      }

      function pdfLine(text, x, y, size = 10, font = "F1") {
        return `BT /${font} ${size} Tf ${x} ${y} Td (${pdfText(text)}) Tj ET`;
      }

      function createFinancePdfBlob(rows) {
        const summary = summarizeTransactions(rows);
        const range = selectedMonthRange();
        const createdAt = new Intl.DateTimeFormat("es-MX", {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(new Date());
        const pages = [];
        const lines = [
          { text: "CARIANA - Reporte financiero", size: 16, font: "F2", gap: 24 },
          { text: `Periodo: ${selectedRangeLabel()}`, size: 11, font: "F1", gap: 16 },
          { text: `Generado: ${createdAt}`, size: 9, font: "F1", gap: 22 },
          { text: `Ventas: ${moneyPlain(summary.salesTotal)}    Gastos: ${moneyPlain(summary.expensesTotal)}    Ganancia: ${moneyPlain(summary.profitTotal)}`, size: 10, font: "F2", gap: 16 },
          { text: `Movimientos: ${summary.count}    Ventas registradas: ${summary.salesCount}    Gastos registrados: ${summary.expensesCount}    Ticket promedio: ${moneyPlain(summary.average)}`, size: 9, font: "F1", gap: 24 },
          { text: "Fecha       Tipo    Metodo          Monto          Concepto", size: 8.5, font: "F3", gap: 12 },
          { text: "--------------------------------------------------------------------------", size: 8.5, font: "F3", gap: 12 }
        ];

        if (rows.length) {
          rows
            .slice()
            .sort((a, b) => a.date.localeCompare(b.date))
            .forEach((item) => {
              lines.push({
                text: [
                  fixedText(item.date, 10),
                  fixedText(item.type === "sale" ? "Venta" : "Gasto", 7),
                  fixedText(item.method, 15),
                  fixedText(moneyPlain(item.amount), 15),
                  fixedText(item.concept, 36)
                ].join(" "),
                size: 8.5,
                font: "F3",
                gap: 12
              });
            });
        } else {
          lines.push({ text: "Sin movimientos registrados en este periodo.", size: 10, font: "F1", gap: 14 });
        }

        let currentPage = [];
        let y = 790;
        for (const line of lines) {
          if (y < 56) {
            pages.push(currentPage);
            currentPage = [];
            y = 790;
          }
          currentPage.push({ ...line, y });
          y -= line.gap || 14;
        }
        pages.push(currentPage);

        const objects = [];
        const addObject = (content) => {
          objects.push(content);
          return objects.length;
        };
        const fontRegularId = addObject("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
        const fontBoldId = addObject("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
        const fontMonoId = addObject("<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>");
        const pageIds = [];

        pages.forEach((page, index) => {
          const footer = pdfLine(`Pagina ${index + 1} de ${pages.length}`, 270, 30, 8, "F1");
          const stream = [
            ...page.map((line) => pdfLine(line.text, 40, line.y, line.size, line.font)),
            footer
          ].join("\n");
          const contentId = addObject(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
          const pageId = addObject(`<< /Type /Page /Parent 0 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontRegularId} 0 R /F2 ${fontBoldId} 0 R /F3 ${fontMonoId} 0 R >> >> /Contents ${contentId} 0 R >>`);
          pageIds.push(pageId);
        });

        const pagesId = addObject(`<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${pageIds.length} >>`);
        for (const pageId of pageIds) {
          objects[pageId - 1] = objects[pageId - 1].replace("/Parent 0 0 R", `/Parent ${pagesId} 0 R`);
        }
        const catalogId = addObject(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);

        let pdf = "%PDF-1.4\n";
        const offsets = [0];
        objects.forEach((content, index) => {
          offsets.push(pdf.length);
          pdf += `${index + 1} 0 obj\n${content}\nendobj\n`;
        });
        const xrefOffset = pdf.length;
        pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
        for (let index = 1; index < offsets.length; index += 1) {
          pdf += `${String(offsets[index]).padStart(10, "0")} 00000 n \n`;
        }
        pdf += `trailer\n<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
        return new Blob([pdf], { type: "application/pdf" });
      }

      function downloadFinancePdf() {
        const rows = visibleTransactions();
        const range = selectedMonthRange();
        const blob = createFinancePdfBlob(rows);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = range.from === range.to
          ? `cariana-finanzas-${range.from}.pdf`
          : `cariana-finanzas-${range.from}-a-${range.to}.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function render() {
        const rows = visibleTransactions();
        const summary = summarizeTransactions(rows);

        document.getElementById("salesTotal").textContent = formatter.format(summary.salesTotal);
        document.getElementById("expensesTotal").textContent = formatter.format(summary.expensesTotal);
        document.getElementById("profitTotal").textContent = formatter.format(summary.profitTotal);
        document.getElementById("averageTicket").textContent = formatter.format(summary.average);
        body.innerHTML = "";
        rows.forEach((item) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.date}</td>
            <td><span class="pill ${item.type}">${item.type === "sale" ? "Venta" : "Gasto"}</span></td>
            <td>${item.concept}</td>
            <td>${item.method}</td>
            <td>${formatter.format(Number(item.amount))}</td>
            <td><button class="btn danger" data-delete="${item.id}" type="button">Eliminar</button></td>
          `;
          body.appendChild(tr);
        });

        table.hidden = rows.length === 0;
        emptyState.hidden = rows.length > 0;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const transactions = readTransactions();
        transactions.push({
          id: crypto.randomUUID(),
          type: document.getElementById("type").value,
          date: document.getElementById("date").value,
          concept: document.getElementById("concept").value.trim(),
          method: document.getElementById("method").value,
          amount: Number(document.getElementById("amount").value || 0)
        });
        writeTransactions(transactions);
        form.reset();
        document.getElementById("date").value = todayIso;
        render();
      });

      body.addEventListener("click", (event) => {
        const id = event.target.dataset.delete;
        if (!id) return;
        writeTransactions(readTransactions().filter((item) => item.id !== id));
        render();
      });

      document.getElementById("clearButton").addEventListener("click", () => {
        const range = selectedMonthRange();
        const remaining = readTransactions().filter((item) => {
          const itemMonth = String(item.date || "").slice(0, 7);
          return itemMonth < range.from || itemMonth > range.to;
        });
        writeTransactions(remaining);
        render();
      });

      downloadPdfButton.addEventListener("click", downloadFinancePdf);

      document.getElementById("seedButton").addEventListener("click", () => {
        const samples = [
          { type: "sale", concept: "Venta Shopify", method: "Shopify", amount: 1280 },
          { type: "sale", concept: "Venta en tienda", method: "Efectivo", amount: 640 },
          { type: "expense", concept: "Envios", method: "Transferencia", amount: 210 },
          { type: "expense", concept: "Empaque", method: "Tarjeta", amount: 155 }
        ];
        const transactions = readTransactions();
        samples.forEach((sample) => {
          transactions.push({ id: crypto.randomUUID(), date: todayIso, ...sample });
        });
        writeTransactions(transactions);
        render();
      });

      monthFromFilter.addEventListener("change", render);
      monthToFilter.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
