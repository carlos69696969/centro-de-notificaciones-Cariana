# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "952fdfd7271a3a55ba1f963a504658d0"
name = "Centro de notificaciones"
application_url = "https://centro-de-notificaciones-cariana.onrender.com"
embedded = true

[webhooks]
api_version = "2026-04"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_customers,read_merchant_managed_fulfillment_orders,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://centro-de-notificaciones-cariana.onrender.com/auth/callback" ]

[app_proxy]
url = "https://centro-de-notificaciones-cariana.onrender.com/proxy/notifications"
subpath = "notificaciones"
prefix = "apps"

[[webhooks.subscriptions]]
topics = [ "orders/create", "orders/updated", "orders/fulfilled", "orders/cancelled", "fulfillment_orders/line_items_prepared_for_local_delivery", "refunds/create", "checkouts/update" ]
uri = "/webhooks/shopify"

[build]
automatically_update_urls_on_dev = true
